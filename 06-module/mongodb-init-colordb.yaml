apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-colordb
  labels:
    app: mongodb
data:
  init-db.js: |
    const dbName = process.env.DB_NAME;
    const dbUser = process.env.DB_USER;
    const dbPassword = process.env.DB_PASSWORD;

    const missing = [];
    if (!dbName) missing.push('DB_NAME');
    if (!dbUser) missing.push('DB_USER');
    if (!dbPassword) missing.push('DB_PASSWORD');
    if (missing.length > 0) {
      throw new Error(`Missing required environment variables: ${missing.join(', ')}`);
    }

    db = db.getSiblingDB(dbName);

    console.log(`Creating database: ${dbName}`);
    console.log(`Creating user: ${dbUser}`);

    db.createUser({
      user: dbUser,
      pwd: dbPassword,
      roles: [{ role: 'readWrite', db: dbName }]
    });

    console.log(`User ${dbUser} created with readWrite access to database ${dbName}`);