apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: color-api
  template:
    metadata:
      labels: 
        app: color-api
    spec:
      containers:
      - name: color-api
        image: selcouthonism/color-api-image:1.2.1
        ports:
        - containerPort: 80
      resources:
        limits:
          memory: "128Mi"
          cpu: "250m"
        requests:
          memory: "64Mi"
          cpu: "128m"