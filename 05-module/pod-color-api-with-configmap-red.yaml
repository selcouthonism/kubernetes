apiVersion: v1
kind: Pod
metadata:
  name: color-api-pod-red
  labels:
    app: color-api-app-red
spec:
  containers:
    - name: color-api-container
      image: selcouthonism/color-api-image:1.3.0
      #envFrom:
      #  - configMapRef:
      #      name: color-api-config-red
      env:
        - name: DEFAULT_COLOR
          valueFrom:
            configMapKeyRef:
              name: color-api-config-red
              key: COLOR
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"