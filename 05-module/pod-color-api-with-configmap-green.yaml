apiVersion: v1
kind: Pod
metadata:
  name: color-api-pod-green
  labels:
    app: color-api-app-green
spec:
  containers:
    - name: color-api-container
      image: selcouthonism/color-api-image:1.3.0
      env:
        - name: COLOR_CONFIG_PATH
          valueFrom:
            configMapKeyRef:
              name: color-api-config-green
              key: COLOR_CONFIG_PATH
      volumeMounts:
        - name: color-api-config-volume # Must match the volume name below
          mountPath: /mnt/config
          readOnly: true
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
  volumes:
    - name: color-api-config-volume
      configMap:
        name: color-api-config-green