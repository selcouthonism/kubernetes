apiVersion: v1
kind: Pod
metadata:
  name: empty-dir-demo
  labels:
    app: empty-dir-demo
spec:
  containers:
    - name: empty-dir-writer
      image: busybox:latest
      command: [ "sh", "-c", "sleep 3600" ]
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - name: temporary-storage
          mountPath: /usr/share/temp
    - name: empty-dir-reader
      image: busybox:latest
      command: [ "sh", "-c", "sleep 3600" ]
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - name: temporary-storage
          mountPath: /temp 
          readOnly: true         
  volumes:
    - name: temporary-storage
      emptyDir: {}
      #  medium: Memory # It will consume container memory limit
      #  sizeLimit: "10Mi" # Maximum size of the emptyDir volume