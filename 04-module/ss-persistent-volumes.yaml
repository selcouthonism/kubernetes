# There are 3 local persistent volumes for statefulset pods
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ss-0
spec:
  capacity:
    storage: 128Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/disks/ss-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            # kubectl describe node minikube
            - key: kubernetes.io/hostname
              operator: In
              values: ["minikube"]
