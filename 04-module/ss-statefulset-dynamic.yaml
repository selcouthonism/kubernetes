apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-ss-dynamic
spec:
  serviceName: busybox-service
  replicas: 2
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
        - name: busybox-container
          image: busybox:latest
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          volumeMounts:
            - name: local-volume
              mountPath: /mnt/local  # mount path inside the container
  volumeClaimTemplates:
    - metadata:
        name: local-volume
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard # Use default storage class for dynamic provisioning "kubectl get storageclass"
        resources:
          requests:
            storage: 128Mi
        volumeMode: Filesystem